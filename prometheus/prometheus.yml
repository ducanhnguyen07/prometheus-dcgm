global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - "alertmanager:9093"

rule_files:
  - "/opt/bitnami/prometheus/conf/rules.yml"

scrape_configs:
  - job_name: "prometheus-local"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "gitlab-server"
    static_configs:
      - targets: ["192.168.42.130:9101"]

  - job_name: "database-server"
    static_configs:
      - targets: ["192.168.42.115:9100"]