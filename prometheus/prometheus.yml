global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - "alertmanager:9093"

rule_files:
  - "/opt/bitnami/prometheus/conf/rules.yml"

scrape_configs:
  - job_name: "prometheus-local"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "git-db-server"
    file_sd_configs:
      - files:
        - '/opt/bitnami/prometheus/conf/targets.json'