groups:

- name: host_alerts
  rules:
  - alert: InstanceDown
    expr: up == 0 or absent_over_time(up[1m])
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Instance {{ $labels.instance }} down"
      description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute."

- name: cpu_alerts
  rules:
  - alert: HighCpuUsage
    expr: sum by (instance) (rate(node_cpu_seconds_total{mode!="idle"}[5m])) * 100 > 1
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "Instance {{ $labels.instance }} High CPU Usage warning"
      description: "{{ $labels.instance }} of job {{ $labels.job }} has been high cpu usage warning."
  - alert: HighCpuUsage
    expr: sum by (instance) (rate(node_cpu_seconds_total{mode!="idle"}[5m])) * 100 > 8
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Instance {{ $labels.instance }} High CPU Usage critical"
      description: "{{ $labels.instance }} of job {{ $labels.job }} has been high cpu usage critical."